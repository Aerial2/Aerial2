name: Update Image Assets

# 把 README 里用到的所有外部图片下载到 assets/ 目录并提交，
# 这样 README 只用仓库内的相对路径，不再依赖被墙的第三方图床。
on:
  schedule:
    # 每 6 小时刷新一次
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download images into assets/
        run: |
          set -u
          mkdir -p assets
          ok=0
          fail=0
          while IFS='|' read -r name url; do
            [ -z "${name:-}" ] && continue
            case "$name" in \#*) continue ;; esac
            if curl -fsSL --retry 3 --retry-delay 3 --retry-all-errors --max-time 60 \
                 -A "Mozilla/5.0 (compatible; README-asset-fetcher)" \
                 "$url" -o "assets/$name"; then
              echo "OK   $name"
              ok=$((ok + 1))
            else
              echo "FAIL $name"
              rm -f "assets/$name"
              fail=$((fail + 1))
            fi
          done <<'LIST'
          header.svg|https://capsule-render.vercel.app/api?type=waving&color=0:6C5CE7,50:00CEC9,100:00B894&height=210&section=header&text=Aerial2&fontSize=76&fontColor=ffffff&fontAlignY=34&animation=fadeIn&desc=Panda%20%C2%B7%20Terminal%20%26%20Ops%20Workbench&descAlignY=55&descSize=19
