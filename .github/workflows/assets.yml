name: Update Image Assets

# 1) 把仍然可用的第三方图片（头图、徽章、streak、打字机等）下载到 assets/
# 2) 用 GitHub API 自行渲染统计卡片，不再依赖 github-readme-stats 等已停服的公共实例
# 这样 README 只用仓库内的相对路径，彻底摆脱 camo 代理与被墙的图床。
on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download external images into assets/
        run: |
          set -u
          mkdir -p assets
          ok=0
          fail=0
          while IFS='|' read -r name url; do
            [ -z "${name:-}" ] && continue
            case "$name" in \#*) continue ;; esac
            if curl -fsSL --retry 3 --retry-delay 3 --retry-all-errors --max-time 60 \
                 -A "Mozilla/5.0 (compatible; README-asset-fetcher)" \
                 "$url" -o "assets/$name"; then
              echo "OK   $name"
              ok=$((ok + 1))
            else
              echo "FAIL $name"
              rm -f "assets/$name"
              fail=$((fail + 1))
            fi
          done <<'LIST'
          header.svg|https://capsule-render.vercel.app/api?type=waving&color=0:6C5CE7,50:00CEC9,100:00B894&height=210&section=header&text=Aerial2&fontSize=76&fontColor=ffffff&fontAlignY=34&animation=fadeIn&desc=Panda%20%C2%B7%20Terminal%20%26%20Ops%20Workbench&descAlignY=55&descSize=19
          footer.svg|https://capsule-render.vercel.app/api?type=waving&color=0:00B894,50:00CEC9,100:6C5CE7&height=120&section=footer
          typing.svg|https://readme-typing-svg.demolab.com?font=JetBrains+Mono&weight=700&size=23&duration=3000&pause=700&color=00CEC9&center=true&vCenter=true&width=680&lines=SSH+%C2%B7+Terminal+%C2%B7+Ops+Workbench;AI+Gateway+%26+Account+Pooling;Tauri+%C2%B7+Rust+%C2%B7+React+%C2%B7+TypeScript;Build+small+things%2C+build+them+well.
          views.svg|https://komarev.com/ghpvc/?username=Aerial2&label=Profile%20Views&color=6C5CE7&style=for-the-badge
          followers.svg|https://img.shields.io/github/followers/Aerial2?label=Followers&style=for-the-badge&color=00CEC9&labelColor=1a1b27
          focus.svg|https://img.shields.io/badge/Focus-DevTools%20%26%20AI%20Infra-00B894?style=for-the-badge&labelColor=1a1b27
          badge-typescript.svg|https://img.shields.io/badge/TypeScript-3178C6?style=for-the-badge&logo=typescript&logoColor=white
          badge-javascript.svg|https://img.shields.io/badge/JavaScript-F7DF1E?style=for-the-badge&logo=javascript&logoColor=black
          badge-rust.svg|https://img.shields.io/badge/Rust-000000?style=for-the-badge&logo=rust&logoColor=white
          badge-go.svg|https://img.shields.io/badge/Go-00ADD8?style=for-the-badge&logo=go&logoColor=white
          badge-python.svg|https://img.shields.io/badge/Python-3776AB?style=for-the-badge&logo=python&logoColor=white
          badge-react.svg|https://img.shields.io/badge/React-61DAFB?style=for-the-badge&logo=react&logoColor=black
          badge-vue.svg|https://img.shields.io/badge/Vue.js-4FC08D?style=for-the-badge&logo=vuedotjs&logoColor=white
          badge-vite.svg|https://img.shields.io/badge/Vite-646CFF?style=for-the-badge&logo=vite&logoColor=white
          badge-elementplus.svg|https://img.shields.io/badge/Element%20Plus-409EFF?style=for-the-badge&logo=element&logoColor=white
          badge-tauri.svg|https://img.shields.io/badge/Tauri%202-24C8DB?style=for-the-badge&logo=tauri&logoColor=white
          badge-nodejs.svg|https://img.shields.io/badge/Node.js-339933?style=for-the-badge&logo=nodedotjs&logoColor=white
          badge-tokio.svg|https://img.shields.io/badge/Tokio-000000?style=for-the-badge&logo=rust&logoColor=white
          badge-docker.svg|https://img.shields.io/badge/Docker-2496ED?style=for-the-badge&logo=docker&logoColor=white
          badge-linux.svg|https://img.shields.io/badge/Linux-FCC624?style=for-the-badge&logo=linux&logoColor=black
          badge-nginx.svg|https://img.shields.io/badge/Nginx-009639?style=for-the-badge&logo=nginx&logoColor=white
          badge-redis.svg|https://img.shields.io/badge/Redis-DC382D?style=for-the-badge&logo=redis&logoColor=white
          badge-mysql.svg|https://img.shields.io/badge/MySQL-4479A1?style=for-the-badge&logo=mysql&logoColor=white
          badge-git.svg|https://img.shields.io/badge/Git-F05032?style=for-the-badge&logo=git&logoColor=white
          card-streak.svg|https://streak-stats.demolab.com?user=Aerial2&hide_border=true&background=0D1117&ring=6C5CE7&fire=00B894&currStreakLabel=00CEC9&sideLabels=c9d1d9&dates=8b949e&currStreakNum=ffffff&sideNums=ffffff
          badge-github.svg|https://img.shields.io/badge/GitHub-Aerial2-181717?style=for-the-badge&logo=github&logoColor=white
          badge-star.svg|https://img.shields.io/badge/Star-PandaTerm-00CEC9?style=for-the-badge&logo=githubsponsors&logoColor=white
          LIST
          echo "----------------------------------------"
          echo "downloaded: $ok   failed: $fail"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Generate stats cards from GitHub API
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USER: ${{ github.repository_owner }}
        run: node scripts/gen-cards.mjs

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets
          if git diff --cached --quiet; then
            echo "No asset changes."
          else
            git commit -m "chore: refresh image assets [skip ci]"
            git push
          fi
