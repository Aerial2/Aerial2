          typing.svg|https://readme-typing-svg.demolab.com?font=JetBrains+Mono&weight=700&size=23&duration=3000&pause=700&color=00CEC9&center=true&vCenter=true&width=680&lines=SSH+%C2%B7+Terminal+%C2%B7+Ops+Workbench;AI+Gateway+%26+Account+Pooling;Tauri+%C2%B7+Rust+%C2%B7+React+%C2%B7+TypeScript;Build+small+things%2C+build+them+well.
          views.svg|https://komarev.com/ghpvc/?username=Aerial2&label=Profile%20Views&color=6C5CE7&style=for-the-badge
          followers.svg|https://img.shields.io/github/followers/Aerial2?label=Followers&style=for-the-badge&color=00CEC9&labelColor=1a1b27
          focus.svg|https://img.shields.io/badge/Focus-DevTools%20%26%20AI%20Infra-00B894?style=for-the-badge&labelColor=1a1b27
          badge-typescript.svg|https://img.shields.io/badge/TypeScript-3178C6?style=for-the-badge&logo=typescript&logoColor=white
          badge-javascript.svg|https://img.shields.io/badge/JavaScript-F7DF1E?style=for-the-badge&logo=javascript&logoColor=black
          badge-rust.svg|https://img.shields.io/badge/Rust-000000?style=for-the-badge&logo=rust&logoColor=white
          badge-go.svg|https://img.shields.io/badge/Go-00ADD8?style=for-the-badge&logo=go&logoColor=white
          badge-python.svg|https://img.shields.io/badge/Python-3776AB?style=for-the-badge&logo=python&logoColor=white
          badge-react.svg|https://img.shields.io/badge/React-61DAFB?style=for-the-badge&logo=react&logoColor=black
          badge-vue.svg|https://img.shields.io/badge/Vue.js-4FC08D?style=for-the-badge&logo=vuedotjs&logoColor=white
          badge-vite.svg|https://img.shields.io/badge/Vite-646CFF?style=for-the-badge&logo=vite&logoColor=white
