          card-activity.svg|https://github-readme-activity-graph.vercel.app/graph?username=Aerial2&bg_color=0D1117&color=00CEC9&line=6C5CE7&point=00B894&area=true&hide_border=true
          card-trophy.svg|https://github-profile-trophy.vercel.app/?username=Aerial2&theme=tokyonight&no-frame=true&no-bg=true&column=7&margin-w=8&margin-h=8
          badge-github.svg|https://img.shields.io/badge/GitHub-Aerial2-181717?style=for-the-badge&logo=github&logoColor=white
          badge-star.svg|https://img.shields.io/badge/Star-PandaTerm-00CEC9?style=for-the-badge&logo=githubsponsors&logoColor=white
          LIST
          echo "----------------------------------------"
          echo "downloaded: $ok   failed: $fail"

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets
          if git diff --cached --quiet; then
            echo "No asset changes."
          else
            git commit -m "chore: refresh image assets [skip ci]"
            git push
          fi
