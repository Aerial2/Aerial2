  <text x="54" y="130" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="700" letter-spacing="5.5" fill="#8b949e">GATEWAY DEFENDER</text>
  <text x="54" y="160" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#c9d1d9">挡住请求包，清空故障砖块</text>

